<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 赛车</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif}
#game{position:fixed;inset:0}#hud{position:fixed;top:14px;left:14px;color:#fff;z-index:2;text-shadow:0 2px 4px #000;font-weight:700}
#hud div{margin:5px 0}.title{font-size:20px}.value{font-size:16px}
#help{position:fixed;top:14px;right:14px;color:#fff;z-index:2;text-align:right;text-shadow:0 2px 4px #000}
#controls{position:fixed;inset:auto 0 22px 0;display:flex;justify-content:space-between;padding:0 24px;z-index:3;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.btn{width:68px;height:68px;border:2px solid #ffffff66;border-radius:18px;background:#ffffff22;color:#fff;font-size:28px;backdrop-filter:blur(5px);touch-action:none}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:14px 28px;border:0;border-radius:12px;background:#fff;color:#111;font-size:18px;font-weight:700}
#msg{position:fixed;left:50%;top:34%;transform:translateX(-50%);color:#fff;font-size:30px;font-weight:800;z-index:4;text-shadow:0 3px 8px #000}
@media(max-width:700px){#help{font-size:12px}.btn{width:62px;height:62px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="title">🏁 3D 赛车</div><div>速度：<span id="speed">0</span> km/h</div><div>圈数：<span id="lap">1</span> / 3</div><div>时间：<span id="time">0.0</span> s</div></div>
<div id="help">WASD / 方向键<br>手机使用下方按钮</div>
<div id="msg"></div>
<button id="start">开始比赛</button>
<div id="controls"><div class="pad"><button class="btn" data-key="left">←</button><button class="btn" data-key="right">→</button></div><div class="pad"><button class="btn" data-key="brake">▼</button><button class="btn" data-key="up">▲</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x496b35,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,40,10);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x4f8a3c}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const road=new THREE.Mesh(new THREE.RingGeometry(24,34,128),new THREE.MeshStandardMaterial({color:0x30343b}));
road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);
const inner=new THREE.Mesh(new THREE.RingGeometry(23.8,24.3,128),new THREE.MeshStandardMaterial({color:0xffffff}));
inner.rotation.x=-Math.PI/2;scene.add(inner);
const outer=new THREE.Mesh(new THREE.RingGeometry(33.7,34.2,128),new THREE.MeshStandardMaterial({color:0xffffff}));
outer.rotation.x=-Math.PI/2;scene.add(outer);

for(let i=0;i<64;i++){
  const a=i/64*Math.PI*2,r=29;
  const mark=new THREE.Mesh(new THREE.BoxGeometry(.45,.02,1.8),new THREE.MeshStandardMaterial({color:0xffffff}));
  mark.position.set(Math.cos(a)*r,.03,Math.sin(a)*r);mark.rotation.y=-a;scene.add(mark);
}
function car(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.65,4),new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.45}));
  body.position.y=.7;body.castShadow=true;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,.65,1.8),new THREE.MeshStandardMaterial({color:0x17202a,roughness:.2,metalness:.3}));
  cabin.position.set(0,1.2,-.15);cabin.castShadow=true;g.add(cabin);
  for(const x of [-1.05,1.05])for(const z of [-1.25,1.25]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,16),new THREE.MeshStandardMaterial({color:0x111111}));
    w.rotation.z=Math.PI/2;w.position.set(x,.42,z);w.castShadow=true;g.add(w);
  }
  return g;
}
const player=car(0xe53935);player.position.set(0,.0,29);player.rotation.y=Math.PI;scene.add(player);
const opponents=[];
for(let i=0;i<3;i++){const c=car([0x1976d2,0xffc107,0x8e24aa][i]);const a=(i+1)*.45;
  c.userData={angle:Math.PI/2+a,speed:0.0009+i*.00008,laps:0};scene.add(c);opponents.push(c);}
const keys={up:false,down:false,left:false,right:false};
function bind(k,on){keys[k]=on}
addEventListener('keydown',e=>{const m={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(m){e.preventDefault();bind(m,true)}});
addEventListener('keyup',e=>{const m={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(m)bind(m,false)});
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();bind(k,true)};const off=e=>{e.preventDefault();bind(k,false)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});

let running=false,finished=false,startTime=0,lap=1,progress=0,velocity=0;
const start=document.getElementById('start'),msg=document.getElementById('msg');
start.onclick=()=>{running=true;finished=false;startTime=performance.now();lap=1;progress=0;velocity=0;player.position.set(0,0,29);player.rotation.y=Math.PI;msg.textContent='';start.style.display='none'};
function trackPos(t,r=29){return new THREE.Vector3(Math.cos(t)*r,0,Math.sin(t)*r)}
function updatePlayer(dt){
  const max=0.0018;
  if(keys.up)velocity=Math.min(max,velocity+dt*.0000012);else velocity*=Math.pow(.998,dt/16);
  if(keys.down)velocity=Math.max(-.0003,velocity-dt*.0000018);
  const steer=(keys.left?1:0)-(keys.right?1:0);
  progress+=velocity*dt;
  const angle=Math.PI/2+progress;
  const r=29;
  player.position.copy(trackPos(angle,r));player.position.y=.02;
  player.rotation.y=-angle+Math.PI/2-steer*.12;
  const speed=Math.abs(velocity)*52000;
  document.getElementById('speed').textContent=Math.round(speed);
  const newLap=Math.floor(Math.max(0,progress)/(Math.PI*2))+1;
  if(newLap>lap){lap=newLap;if(lap>3){running=false;finished=true;msg.textContent='🏆 比赛完成！';start.textContent='再来一局';start.style.display='block'}document.getElementById('lap').textContent=Math.min(lap,3)+' / 3'}
}
function updateOpponents(dt){
  opponents.forEach(c=>{c.userData.angle+=c.userData.speed*dt;c.position.copy(trackPos(c.userData.angle,29));c.position.y=.02;c.rotation.y=-c.userData.angle+Math.PI/2});
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const dt=clock.getDelta()*1000;
  if(running){updatePlayer(dt);updateOpponents(dt);document.getElementById('time').textContent=((performance.now()-startTime)/1000).toFixed(1)}
  const target=player.position.clone();target.y+=4.2;
  const behind=new THREE.Vector3(Math.sin(player.rotation.y)*7,5.2,Math.cos(player.rotation.y)*7);
  camera.position.lerp(player.position.clone().add(behind),.08);camera.lookAt(target);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body></html>
