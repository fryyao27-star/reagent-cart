<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="试剂采购" />
    <title>智能试剂采购助手</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ── 离线状态条 ───────────────────────────────── */
        .offline-banner { display:none; position:sticky; top:0; z-index:60;
            background:#fef3c7; color:#92400e; font-size:12px; padding:6px 12px;
            text-align:center; border-bottom:1px solid #fde68a; }
        .offline-banner.show { display:flex; align-items:center; justify-content:center; gap:6px; }

        /* ── 步进按钮：放大到 36px ───────────────────── */
        .qty-btn { width:36px; height:36px; display:flex; align-items:center; justify-content:center;
            background:#f3f4f6; border-radius:10px; font-weight:700; color:#4b5563;
            transition:all .15s; user-select:none; -webkit-tap-highlight-color:transparent; }
        .qty-btn:active { background:#d1d5db; transform:scale(.9); }
        .qty-input { width:56px; height:36px; text-align:center; background:#f9fafb;
            border:1px solid #e5e7eb; border-radius:10px; font-size:14px; font-weight:600;
            -moz-appearance:textfield; }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

        /* ── 快捷日期/备注 chip ─────────────────────── */
        .chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px;
            background:#f3f4f6; color:#374151; border-radius:999px; font-size:12px;
            cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; }
        .chip:active { background:#e5e7eb; transform:scale(.95); }
        .chip.active { background:#dbeafe; color:#1d4ed8; }

        /* ── 撤销 toast 增强 ─────────────────────────── */
        .undo-toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
            background:#1f2937; color:#fff; padding:10px 16px; border-radius:999px;
            font-size:13px; font-weight:500; z-index:50; display:flex; align-items:center; gap:12px;
            box-shadow:0 10px 25px -5px rgba(0,0,0,.25); }
        .undo-toast button { color:#fbbf24; font-weight:700; padding:0 6px; }

        /* ── 列表项过渡 ─────────────────────────────── */
        .reagent-row { transition: background-color .15s; }
        .reagent-row:active { background:#eff6ff; }

        /* ── 同步状态小点 ───────────────────────────── */
        .sync-dot { width:6px; height:6px; border-radius:50%; background:#10b981; display:inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 离线状态条 -->
    <div id="offline-banner" class="offline-banner">
        <i class="fa-solid fa-wifi"></i>
        <span>当前离线，数据已自动保存到本机</span>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-flask-vial text-blue-500"></i>
                智能试剂采购助手
            </h1>
            <div class="flex items-center gap-2 text-xs text-gray-400">
                <span class="sync-dot"></span>
                <span id="storage-status" title="数据存储方式">已保存</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto p-4 space-y-4 flex-1">
        <!-- 添加试剂搜索区 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
            <div class="flex items-center gap-2 text-sm font-semibold text-gray-700">
                <i class="fa-solid fa-magnifying-glass text-blue-500"></i> 添加采购试剂
            </div>
            <div class="relative">
                <input type="text" id="search-input"
                       class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 pr-20 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
                       placeholder="手打或语音搜索试剂名/别名/拼音缩写..." />
                <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
                    <button id="clear-search" class="hidden text-gray-400 hover:text-gray-600 p-1.5" title="清空">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                    <button id="voice-btn"
                            class="bg-red-500 text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-red-600 transition-all shadow-sm relative active:scale-95"
                            title="点击语音输入">
                        <i class="fa-solid fa-microphone text-base" id="voice-icon"></i>
                    </button>
                </div>
            </div>
            <div id="voice-status" class="hidden text-xs text-red-500 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span>正在聆听... 请说出试剂名称</span>
            </div>
            <div id="ios-mic-tip" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-700">
                <i class="fa-solid fa-circle-info"></i> 提示：苹果手机(iOS)请使用 Safari 浏览器打开本应用，并允许麦克风权限。如果语音不工作，可直接手打输入，同样支持拼音和别名。
            </div>
        </div>

        <!-- 搜索结果区 -->
        <div id="results-container" class="hidden bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
            <div class="bg-gray-50 px-4 py-2.5 border-b border-gray-100 flex justify-between items-center text-xs text-gray-500 font-medium">
                <span>检索到 <span id="results-count" class="text-blue-600 font-bold">0</span> 个候选试剂 (点击添加)</span>
                <button id="close-results" class="text-gray-400 hover:text-gray-600 text-base">×</button>
            </div>
            <div id="results-list" class="divide-y divide-gray-50"></div>
        </div>

        <!-- 采购清单 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3 flex-1 flex flex-col min-h-[300px]">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <div class="flex items-center gap-2 text-sm font-semibold text-gray-700">
                    <i class="fa-solid fa-cart-shopping text-blue-500"></i>
                    采购清单
                    <span id="cart-badge" class="bg-blue-100 text-blue-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <button id="clear-cart" class="text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
                    <i class="fa-regular fa-trash-can"></i> 清空
                </button>
            </div>

            <div class="overflow-x-auto -mx-2">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-gray-500 border-b border-gray-100 bg-gray-50/50">
                            <th class="py-2.5 px-2 font-medium text-left">商品信息</th>
                            <th class="py-2.5 px-2 font-medium text-left">规格/厂家</th>
                            <th class="py-2.5 px-2 font-medium text-center w-32">采购数量</th>
                            <th class="py-2.5 px-2 font-medium text-center w-12">操作</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body" class="divide-y divide-gray-100">
                        <tr id="cart-empty-row">
                            <td colspan="4" class="py-10 text-center text-gray-400">
                                <i class="fa-regular fa-clipboard text-3xl mb-2"></i>
                                <p class="text-sm">采购清单为空</p>
                                <p class="text-xs mt-1 text-gray-400">请通过语音或手打搜索试剂并点击添加</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 采购元信息：日期 + 备注 -->
            <div class="pt-3 border-t border-gray-100 space-y-2">
                <!-- 日期行：默认今天 + 快捷 chip -->
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs text-gray-500 shrink-0 w-12">采购日期</span>
                    <input type="text" id="purchase-date" inputmode="numeric"
                           class="bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 w-28"
                           maxlength="8" />
                    <div class="flex gap-1.5" id="date-chips">
                        <span class="chip" data-date-offset="0">今天</span>
                        <span class="chip" data-date-offset="1">明天</span>
                        <span class="chip" data-date-offset="3">3 天后</span>
                        <span class="chip" data-date-offset="7">一周后</span>
                    </div>
                </div>
                <!-- 备注行：常用备注 chip -->
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs text-gray-500 shrink-0 w-12">备注</span>
                    <input type="text" id="purchase-remark"
                           class="bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 flex-1 min-w-[120px]"

                    <div class="flex gap-1.5 flex-wrap" id="remark-chips">
                        <span class="chip" data-remark="紧急采购">紧急</span>
                        <span class="chip" data-remark="月度补货">月度补货</span>
                        <span class="chip" data-remark="试用装">试用装</span>
                        <span class="chip" data-remark="进口产品">进口</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 导出按钮 -->
        <button id="export-excel"
                class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:shadow-lg active:scale-[.98] transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-excel"></i>
            导出采购单 Excel

    </main>

    <footer class="text-center py-4 text-xs text-gray-400 mt-auto border-t border-gray-100 bg-white">
        © 2026 智能采购系统 · 数据本地保存 · 离线可用 · 支持 iOS Safari
    </footer>

    <script>

    // ════════════════════════════════════════════════════════════════════════

            }
        }
        return txt;
    }

    /* ────────────────────────────────────────────────────────────────
     *  #1 优化：IndexedDB 持久化（防丢单）
     *  localStorage 5MB、易被 iOS Safari 清空 → 换 IndexedDB
     * ──────────────────────────────────────────────────────────────── */
    const DB_NAME = 'reagent_assistant_v2';
    const DB_STORE = 'cart';
    const DB_KEY = 'current';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
                e.target.result.createObjectStore(DB_STORE);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function idbGet(key) {
        try {
            const db = await openDB();
            return new Promise((res, rej) => {
                const tx = db.transaction(DB_STORE, 'readonly');
                const r = tx.objectStore(DB_STORE).get(key);
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error);
            });
        } catch (e) { return null; }
    }

    async function idbSet(key, val) {
        try {
            const db = await openDB();
            return new Promise((res, rej) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(val, key);
                tx.oncomplete = () => res(true);
                tx.onerror = () => rej(tx.error);
            });
        } catch (e) { return false; }
    }

    // 启动时一次性迁移：如果 IDB 为空但 localStorage 有数据，自动搬过来
    async function migrateFromLocalStorage() {
        const idbVal = await idbGet(DB_KEY);
        if (idbVal) return idbVal;
        try {
            const ls = localStorage.getItem('reagents_cart');
            if (ls) {
                const arr = JSON.parse(ls);
                if (Array.isArray(arr) && arr.length) {
                    await idbSet(DB_KEY, arr);
                    return arr;
                }
            }
        } catch (e) {}
        return [];
    }

        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    function isValidDate(s) {
        if (!/^\d{8}$/.test(s)) return false;
        const y = +s.slice(0,4), m = +s.slice(4,6), d = +s.slice(6,8);
        const dt = new Date(y, m-1, d);
        return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
    }

        if (!query) return false;
        const q = query.toLowerCase().trim();
        const text = expandSearchText(item);
        // 多词空格分隔 AND 匹配
        const terms = q.split(/\s+/);
        return terms.every(t => text.includes(t));
    }

    /* ────────────────────────────────────────────────────────────────

    function renderCart() {
        scheduleSave();
        cartBadge.textContent = cart.length;

        const rows = cartTableBody.querySelectorAll('tr:not(#cart-empty-row)');
        rows.forEach(r => r.remove());

        if (cart.length === 0) {
            cartEmptyRow.classList.remove('hidden');
            return;
        }
        cartEmptyRow.classList.add('hidden');

        cart.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50/50';
            tr.innerHTML = `
                <td class="py-3 px-2">
                    <div class="font-medium text-gray-900">${escapeHtml(item.name)}</div>
                    <div class="text-xs text-gray-400 md:hidden mt-0.5">${escapeHtml(item.category || '')}</div>
                </td>
                <td class="py-3 px-2 text-xs">
                    <div class="text-gray-700">${escapeHtml(item.spec || '-')}</div>
                    <div class="text-gray-400 mt-0.5">${escapeHtml(item.manufacturer || '-')}</div>
                </td>
                <td class="py-3 px-2">
                    <div class="flex items-center justify-center gap-1">
                        <button onclick="changeQty(${index}, -1)" class="qty-btn text-base">−</button>
                        <input type="number" value="${item.qty}"
                               onchange="setQty(${index}, this.value)"
                               oninput="setQtyLive(${index}, this.value)"
                               class="qty-input text-xs" min="1" />
                        <button onclick="changeQty(${index}, 1)" class="qty-btn text-base">+</button>
                    </div>
                </td>
                <td class="py-3 px-2 text-center">
                    <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 p-2 rounded hover:bg-red-50 transition-all" title="删除">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;
            cartTableBody.appendChild(tr);
        });
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    function addToCart(reagent, qty) {
        const q = Math.max(1, parseInt(qty, 10) || 1);
        const existing = cart.find(x =>
            x.name === reagent.name && x.spec === reagent.spec && x.manufacturer === reagent.manufacturer
        );
        if (existing) {
            existing.qty += q;
        } else {
            cart.push({
                category: reagent.category,
                name: reagent.name,
                spec: reagent.spec,
                unit: reagent.unit,
                manufacturer: reagent.manufacturer,
                qty: q
            });
        }
        renderCart();
        showToast(`已添加 ${reagent.name} × ${q}`);
    }

    window.changeQty = function(index, delta) {
        cart[index].qty = Math.max(1, (cart[index].qty || 1) + delta);
        renderCart();
    };

    // 失焦时规范化（#2 优化：数量校验）
    window.setQty = function(index, value) {
        let v = parseInt(value, 10);
        if (isNaN(v) || v < 1) v = 1;
        if (v > 9999) v = 9999;
        cart[index].qty = v;
        renderCart();
    };

    // 输入过程中也即时校验（防止显示 NaN）
    window.setQtyLive = function(index, value) {
        let v = parseInt(value, 10);
        if (isNaN(v)) v = '';
        if (v < 1) v = 1;
        if (v > 9999) v = 9999;
        cart[index].qty = v;
        scheduleSave();
    };

    // 删除（带 #7 撤销提示，但我们这次没做 #7，所以做基础 toast 提示）
    window.removeFromCart = function(index) {
        const removed = cart[index];
        cart.splice(index, 1);
        renderCart();
        showToast(`已删除：${removed.name}`);
    };

    clearCartBtn.onclick = () => {
        if (cart.length === 0) return;
        if (confirm(`确定清空当前 ${cart.length} 项采购清单吗？`)) {
            cart = [];
            renderCart();
            showToast('采购清单已清空');
        }
    };

    /* ────────────────────────────────────────────────────────────────
     *  Toast 提示
     * ──────────────────────────────────────────────────────────────── */
    function showToast(msg) {
        const div = document.createElement('div');
        div.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center gap-1.5 transition-all opacity-0 scale-90';
        div.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${escapeHtml(msg)}`;
        document.body.appendChild(div);
        setTimeout(() => {
            div.classList.remove('opacity-0', 'scale-90');
            div.classList.add('opacity-100', 'scale-100');
        }, 50);
        setTimeout(() => {
            div.classList.add('opacity-0', 'scale-90');
            setTimeout(() => div.remove(), 300);
        }, 2000);
    }

    /* ────────────────────────────────────────────────────────────────

    /* ────────────────────────────────────────────────────────────────
     *  语音识别（保留原 Safari WebSpeech 逻辑，不在本轮改动）
     * ──────────────────────────────────────────────────────────────── */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'zh-CN';

        recognition.onstart = () => {
            isListening = true;
            voiceBtn.classList.add('bg-red-600', 'animate-pulse');
            voiceStatus.classList.remove('hidden');
            showToast('麦克风已开启，请说话...');
        };

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            const cleanText = resultText.replace(/[。，？！,.?!]/g, '').trim();
            searchInput.value = cleanText;
            updateSearchResults();
            showToast(`识别到: "${cleanText}"`);
        };

        recognition.onerror = (event) => {
            let err_msg = '语音识别出错';
            if (event.error === 'not-allowed') err_msg = '未获麦克风权限！请在浏览器或iOS设置中允许。';
            else if (event.error === 'no-speech') err_msg = '没有听到声音，请重试。';
            showToast(err_msg);
            stopListening();
        };

        recognition.onend = stopListening;
    } else {
        voiceBtn.addEventListener('click', () => {
            alert('您当前浏览器不支持 Web Speech 语音接口。请在苹果手机上使用内置 Safari 浏览器打开此应用，或直接使用手打输入，同样支持别名搜索！');
        });
    }

    function stopListening() {
        isListening = false;
        voiceBtn.classList.remove('bg-red-600', 'animate-pulse');
        voiceStatus.classList.add('hidden');
    }

    if (recognition) {
        voiceBtn.addEventListener('click', () => {
            if (isListening) recognition.stop();
            else recognition.start();
        });
    }

    function updateOnlineStatus() {

            offlineBanner.classList.remove('show');
            storageStatus.textContent = '已保存';
            storageStatus.title = '数据存储于本地 IndexedDB（防丢单）';

            storageStatus.title = '当前离线，已可继续使用';
